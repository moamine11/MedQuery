
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: medical-rag-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: medical_rag
      POSTGRES_USER: medical_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical_user -d medical_rag"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
